[project]
name = "nginx-unit-session-affinity"
version = "0.1.0"
description = "Simple Litestar app for nginx unit session affinity example"
requires-python = ">=3.12"
dependencies = [
    "litestar>=2.21.1",
]

[project.optional-dependencies]
dev = [
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyrefly>=0.63.1",
]
